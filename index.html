<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <title>知行笔记 · 个人博客</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="知行笔记 —— 一个记录学习、思考与生活的个人博客">
  <meta name="viewport"
    content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="//unpkg.com/docsify/lib/themes/vue.css">
  <style>
    :root {
      --theme-color: #5b6ee1;
      --theme-color-2: #7c8ff0;
    }

    /* ---------- 全局字体与底色 ---------- */
    body {
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
    }
    .markdown-section {
      max-width: 820px;
    }

    /* ---------- 侧边栏 ---------- */
    .sidebar {
      background: #fafbfe;
      border-right: 1px solid #eef0f6;
    }
    .sidebar .app-name {
      margin: 22px 0 10px;
    }
    .app-name-link {
      font-size: 21px !important;
      font-weight: 700;
      color: var(--theme-color) !important;
      letter-spacing: 1px;
    }
    /* 一级分组标题 */
    .sidebar-nav > ul > li > strong,
    .sidebar-nav > ul > li > p {
      display: block;
      margin: 18px 0 6px;
      font-size: 13px;
      font-weight: 700;
      color: #8a90a2;
      letter-spacing: .5px;
    }
    .sidebar-nav li > a {
      border-radius: 6px;
      transition: all .15s ease;
    }
    .sidebar-nav li.active > a {
      background: rgba(91,110,225,.10);
      color: var(--theme-color) !important;
      font-weight: 600;
      border-right: none;
    }

    /* ---------- 顶部导航 ---------- */
    .app-nav {
      margin-top: 16px;
    }
    .app-nav a {
      font-size: 15px;
      color: #5a6072;
    }
    .app-nav a:hover { color: var(--theme-color); }

    /* ---------- 封面 ---------- */
    section.cover .cover-main > p:last-child a {
      border-radius: 24px;
      padding: 10px 26px;
    }
    section.cover h1 { letter-spacing: 2px; }

    /* ---------- 正文排版微调 ---------- */
    .markdown-section h1 {
      font-size: 1.9rem;
      border-bottom: 2px solid #eef0f6;
      padding-bottom: .4em;
    }
    .markdown-section h2 {
      font-size: 1.4rem;
      margin-top: 1.8em;
    }
    .markdown-section blockquote {
      border-left: 4px solid var(--theme-color-2);
      background: #f6f7fd;
      border-radius: 0 6px 6px 0;
      color: #5a6072;
    }
    .markdown-section table { display: table; width: 100%; }
    .markdown-section tr:nth-child(2n) { background: #fafbfe; }

    /* 分页 */
    .pagination-item-title { color: var(--theme-color); }
  </style>
</head>

<body>
  <div id="app">加载中，请稍候……</div>
  <script>
    window.$docsify = {
      name: '知行笔记',
      repo: '',
      maxLevel: 5,
      subMaxLevel: 3,
      homepage: 'README.md',
      coverpage: true,
      loadSidebar: true,
      loadNavbar: true,
      auto2top: true,
      mergeNavbar: true,
      // 全文搜索
      search: {
        paths: 'auto',
        placeholder: '搜索文章…',
        noData: '找不到相关内容',
        depth: 4,
      },
      // 分页导航
      pagination: {
        previousText: '上一篇',
        nextText: '下一篇',
        crossChapter: true,
        crossChapterText: true,
      },
      // 字数统计
      count: {
        countable: true,
        fontsize: '0.9em',
        color: 'rgb(140,143,160)',
        language: 'chinese',
      },
    }
  </script>
  <!-- docsify 核心 -->
  <script src="//unpkg.com/docsify/lib/docsify.min.js"></script>
  <!-- 全文搜索 -->
  <script src="//unpkg.com/docsify/lib/plugins/search.min.js"></script>
  <!-- 复制到剪贴板 -->
  <script src="//unpkg.com/docsify-copy-code"></script>
  <!-- 图片缩放 -->
  <script src="//unpkg.com/docsify/lib/plugins/zoom-image.js"></script>
  <!-- 分页导航 -->
  <script src="//unpkg.com/docsify-pagination/dist/docsify-pagination.min.js"></script>
  <!-- 字数统计 -->
  <script src="//unpkg.com/docsify-count/dist/countable.js"></script>
</body>

</html>
